<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Scan the barcode with your phone camera." />
    <title>Barcode</title>
    <link rel="stylesheet" href="styles.css" />
    <!--
      Phase B — After AdSense approval, uncomment the script below and your ad unit in #ad-slot.
      Replace ca-pub-XXXXXXXX with your publisher ID.

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
      crossorigin="anonymous"></script>
    -->
  </head>
  <body>
    <div class="page">
      <main class="content" id="main">
        <figure class="barcode-wrap">
          <img
            class="barcode"
            src="assets/barcode.svg"
            alt="Scannable barcode — replace with your image"
            width="320"
            height="320"
            loading="eager"
            decoding="async"
          />
        </figure>
        <p class="hint">Scan with your phone camera</p>
        <p class="about">
          This page displays a scannable barcode for quick access. Point your camera at the code above.
        </p>
      </main>

      <aside class="ad-section" aria-label="Advertisement">
        <div id="ad-slot" class="ad-slot">
          <!-- Phase B: Replace placeholder with your AdSense unit, e.g. 320×100 responsive display -->
          <!--
          <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-XXXXXXXX"
            data-ad-slot="YYYYYYYYYY"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
          -->
          <div class="ad-placeholder" aria-hidden="true">
            <span class="ad-placeholder-label">Ad space</span>
          </div>
        </div>
      </aside>

      <footer class="footer">
        <a href="privacy.html">Privacy</a>
      </footer>
    </div>
  </body>
</html>
