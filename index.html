<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Scan the barcode with your phone camera." />
    <title>Barcode</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="legal.css" />
    <!-- Phase B — After AdSense approval, set config (ads load only after cookie consent):
    <script>
      window.kartinaAdConfig = { client: "ca-pub-XXXXXXXX", slot: "YYYYYYYYYY" };
    </script>
    -->
  </head>
  <body>
    <div class="page">
      <main class="content" id="main">
        <figure class="barcode-wrap">
          <img
            class="barcode"
            src="assets/barcode.svg"
            alt="Scannable barcode — replace with your image"
            width="320"
            height="320"
            loading="eager"
            decoding="async"
          />
        </figure>
        <p class="hint">Scan with your phone camera</p>
        <p class="about">
          This page displays a scannable barcode for quick access. Point your camera at the code above.
        </p>
      </main>

      <aside class="ad-section" aria-label="Advertisement">
        <div id="ad-slot" class="ad-slot">
          <!-- Phase B: Replace placeholder with your AdSense unit, e.g. 320×100 responsive display -->
          <!--
          <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-XXXXXXXX"
            data-ad-slot="YYYYYYYYYY"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
          -->
          <div class="ad-placeholder" aria-hidden="true">
            <span class="ad-placeholder-label">Ad space</span>
          </div>
        </div>
      </aside>

      <footer class="footer footer-links">
        <a href="privacy.html">Privacy</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="cookies.html">Cookies</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="#" data-cookie-settings>Cookie settings</a>
      </footer>
    </div>
    <script src="cookie-consent.js" defer></script>
  </body>
</html>
